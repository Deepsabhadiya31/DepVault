# Render Blueprint: New → Blueprint → select this repo.
# Equivalent manual settings are in backend/README.md.
services:
  - type: web
    name: depvault-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://depvault.netlify.app
      - key: TRUST_PROXY
        value: "1"
